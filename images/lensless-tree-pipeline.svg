<!-- Cell 12 -->
<path class="caustic" d="M420,55 L455,45 L465,95 L440,105 L400,90 Z" fill="none" stroke="#ccd4e0"/>
<!-- Cell 13 -->
<path class="caustic" d="M440,105 L465,95 L468,145 L452,155 L418,128 Z" fill="none" stroke="#d0d8e8"/>
<!-- Bright nodes at vertices (caustic focus points) -->
<circle cx="270" cy="22"  r="2" fill="#e8eef4" opacity="0.9"/>
<circle cx="320" cy="18"  r="2.5" fill="#ffffff" opacity="0.8"/>
<circle cx="360" cy="38"  r="2" fill="#e8eef4" opacity="0.9"/>
<circle cx="355" cy="80"  r="2.5" fill="#ffffff" opacity="0.85"/>
<circle cx="305" cy="85"  r="2" fill="#e8eef4" opacity="0.8"/>
<circle cx="265" cy="60"  r="2" fill="#ffffff" opacity="0.85"/>
<circle cx="400" cy="90"  r="2.5" fill="#e8eef4" opacity="0.9"/>
<circle cx="295" cy="130" r="2" fill="#ffffff" opacity="0.8"/>
<circle cx="358" cy="125" r="2" fill="#e8eef4" opacity="0.85"/>
<circle cx="375" cy="145" r="2.5" fill="#ffffff" opacity="0.9"/>
<circle cx="318" cy="138" r="2" fill="#e8eef4" opacity="0.8"/>
