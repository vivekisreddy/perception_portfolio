<circle cx="440" cy="105" r="2" fill="#e8eef4" opacity="0.85"/>
<circle cx="452" cy="155" r="2" fill="#ffffff" opacity="0.9"/>
<circle cx="248" cy="125" r="2" fill="#e8eef4" opacity="0.8"/>
<circle cx="242" cy="82"  r="2" fill="#ffffff" opacity="0.85"/>

<!-- Panel 2 label strip -->
<rect x="240" y="215" width="230" height="30" rx="4" fill="#185FA5" opacity="0.9"/>
<text x="355" y="228" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#ffffff">PSF — tape caustic h(x,y)</text>
<text x="355" y="241" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#B5D4F4">calibrated at d = 0.5 m</text>

<!-- Arrow down (panel 2 → panel 4, right side) -->
<line x1="355" y1="249" x2="355" y2="263" stroke="#888780" stroke-width="1.4" marker-end="url(#arr)"/>

<!-- Arrow down (panel 1 → panel 3, left side) -->
<line x1="110" y1="249" x2="110" y2="263" stroke="#888780" stroke-width="1.4" marker-end="url(#arr)"/>

<!-- ── PANEL 3 (bottom-left): Raw blurry measurement ── -->
<rect x="10" y="268" width="200" height="190" rx="5" fill="#050505" stroke="#444441" stroke-width="1"/>

<!-- Blurry overlapping blobs — complete mess, no structure visible -->
<circle class="blob" cx="80"  cy="340" r="55" fill="#185FA5" opacity="0.12"/>
<circle class="blob" cx="110" cy="320" r="48" fill="#378ADD" opacity="0.16"/>
