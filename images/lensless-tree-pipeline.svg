<path class="caustic" d="M265,60 L305,85 L295,130 L248,125 L242,82 Z" fill="none" stroke="#d4dce8"/>
<!-- Cell 4 -->
<path class="caustic" d="M305,85 L355,80 L358,125 L318,138 L295,130 Z" fill="none" stroke="#ccd4e0"/>
<!-- Cell 5 -->
<path class="caustic" d="M355,80 L400,90 L418,128 L375,145 L358,125 Z" fill="none" stroke="#d0d8e4"/>
