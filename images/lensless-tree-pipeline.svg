<svg width="100%" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Lensless camera pipeline — tree, tape PSF caustic, raw encoded measurement, ADMM grayscale reconstruction</title>
<desc>Four panels: scene with tree imaged by lensless tape-diffuser camera, PSF caustic Voronoi-like pattern, blurry raw sensor measurement, ADMM reconstructed grayscale frame.</desc>

<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    /* PSF caustic lines shimmer */
    .caustic { animation: caustic-glow 2.2s ease-in-out infinite; }
    .caustic:nth-child(odd)  { animation-delay: 0.0s; }
    .caustic:nth-child(even) { animation-delay: 1.1s; }
    @keyframes caustic-glow {
      0%,100% { opacity: 0.5; stroke-width: 0.8; }
      50%      { opacity: 1.0; stroke-width: 1.4; }
    }

    /* Raw blob flicker */
    .blob { animation: blob-flicker 0.15s steps(1) infinite; }
    .blob:nth-child(3n)   { animation-delay: 0.00s; }
    .blob:nth-child(3n+1) { animation-delay: 0.05s; }
    .blob:nth-child(3n+2) { animation-delay: 0.10s; }
    @keyframes blob-flicker {
      0%   { opacity: 0.9; }
      50%  { opacity: 0.35; }
      100% { opacity: 0.9; }
    }

    /* Recon reveal */
    .reveal { animation: rev 2.6s ease-in-out infinite; }
    @keyframes rev {
      0%   { opacity: 0.1; }
      55%  { opacity: 1.0; }
      100% { opacity: 0.1; }
    }

    /* Label fade in */
    .lbl { opacity: 0; animation: fin 0.5s ease forwards; }
    .lbl.d1 { animation-delay: 0.1s; }
    .lbl.d2 { animation-delay: 0.3s; }
    .lbl.d3 { animation-delay: 0.5s; }
    .lbl.d4 { animation-delay: 0.7s; }
    @keyframes fin { to { opacity: 1; } }
  </style>
</defs>

<!-- ═══════════════════════════════════════════
     LAYOUT: 2x2 grid, each cell ~220x200
     Labels below each image, arrows between
     ═══════════════════════════════════════════ -->

<!-- ── PANEL 1 (top-left): Scene + Camera ── -->
<rect x="10" y="10" width="200" height="200" rx="5" fill="#1a1917" stroke="#3B6D11" stroke-width="1"/>

<!-- Tree trunk -->
<rect x="97" y="128" width="10" height="62" rx="2" fill="#444441"/>
<!-- Canopy -->
<polygon points="102,28  76,88  128,88"  fill="#27500A"/>
<polygon points="102,48  72,108 132,108" fill="#3B6D11"/>
<polygon points="102,70  68,132 136,132" fill="#27500A"/>
<!-- Branch details -->
<line x1="82" y1="100" x2="68"  y2="112" stroke="#27500A" stroke-width="1" opacity="0.7"/>
<line x1="122" y1="100" x2="136" y2="112" stroke="#27500A" stroke-width="1" opacity="0.7"/>
<!-- Ground -->
<rect x="10" y="190" width="200" height="20" rx="0" fill="#2C2C2A"/>

<!-- Camera body bottom-right of panel -->
<rect x="148" y="140" width="42" height="28" rx="3" fill="#444441"/>
<!-- Sensor window -->
<rect x="152" y="144" width="16" height="20" rx="1" fill="#185FA5" opacity="0.5"/>
<!-- Tape strip on lens mount -->
<rect x="188" y="143" width="6" height="22" rx="1" fill="#B5D4F4" opacity="0.8" stroke="#378ADD" stroke-width="0.6"/>
<!-- IR LED -->
<circle cx="142" cy="150" r="5" fill="#EF9F27" opacity="0.8"/>
<circle cx="142" cy="150" r="2.5" fill="#ffffff" opacity="0.9"/>
<!-- Light rays -->
<line x1="112" y1="88"  x2="186" y2="148" stroke="#1D9E75" stroke-width="0.6" stroke-dasharray="3 2" opacity="0.45"/>
<line x1="102" y1="108" x2="186" y2="154" stroke="#1D9E75" stroke-width="0.6" stroke-dasharray="3 2" opacity="0.45"/>
<line x1="100" y1="128" x2="186" y2="160" stroke="#1D9E75" stroke-width="0.6" stroke-dasharray="3 2" opacity="0.45"/>

<!-- Panel 1 label strip -->
<rect x="10" y="215" width="200" height="30" rx="4" fill="#27500A" opacity="0.9"/>
<text x="110" y="228" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#ffffff">Scene + lensless camera</text>
<text x="110" y="241" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#C0DD97">scotch tape as diffuser</text>

<!-- Arrow right (panel 1 → panel 2) -->
<line x1="218" y1="110" x2="232" y2="110" stroke="#888780" stroke-width="1.4" marker-end="url(#arr)"/>

<!-- ── PANEL 2 (top-right): PSF caustic pattern ── -->
<rect x="240" y="10" width="230" height="200" rx="5" fill="#050505" stroke="#185FA5" stroke-width="1"/>

