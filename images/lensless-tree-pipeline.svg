<circle cx="195" cy="310" r="1"   fill="#85B7EB" opacity="0.3"/>

<!-- y = HI+n label inside dark area (top-left, clear space) -->
<text x="22" y="292" font-family="system-ui,sans-serif" font-size="9" fill="#5F5E5A" opacity="0.7">y = HI + n</text>

<!-- Panel 3 label strip -->
<rect x="10" y="462" width="200" height="14" rx="3" fill="#444441" opacity="0.9"/>
<text x="110" y="473" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#ffffff">Raw sensor — multiplexed blurry mess</text>

<!-- Arrow right (panel 3 → panel 4) -->
<line x1="214" y1="363" x2="232" y2="363" stroke="#888780" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="223" y="357" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#085041" font-weight="600">ADMM</text>
<text x="223" y="374" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#085041">1 iter</text>

<!-- ── PANEL 4 (bottom-right): ADMM reconstructed grayscale ── -->
<rect x="240" y="268" width="230" height="190" rx="5" fill="#1a1917" stroke="#854F0B" stroke-width="1"/>

<!-- Reconstructed grayscale tree — structure recovered -->
<g class="reveal">
  <!-- Dark sky background already from parent rect -->
  <!-- Ground -->
  <rect x="240" y="428" width="230" height="30" rx="0" fill="#444441"/>

  <!-- Trunk -->
  <rect x="341" y="368" width="12" height="62" rx="2" fill="#888780"/>

  <!-- Canopy — grayscale, bright top (near=bright foreground emphasis) -->
  <polygon points="347,278  318,338 376,338" fill="#D3D1C7"/>
  <polygon points="347,300  314,358 380,358" fill="#B4B2A9"/>
  <polygon points="347,325  310,380 384,380" fill="#888780"/>

  <!-- Bright outlines (TV regularization preserves edges) -->
  <polygon points="347,278  318,338 376,338" fill="none" stroke="#F1EFE8" stroke-width="1.2" opacity="0.9"/>
  <polygon points="347,300  314,358 380,358" fill="none" stroke="#D3D1C7" stroke-width="0.8" opacity="0.7"/>
  <polygon points="347,325  310,380 384,380" fill="none" stroke="#B4B2A9" stroke-width="0.6" opacity="0.5"/>

  <!-- Branch lines -->
  <line x1="322" y1="342" x2="308" y2="356" stroke="#888780" stroke-width="1" opacity="0.6"/>
  <line x1="372" y1="342" x2="386" y2="356" stroke="#888780" stroke-width="1" opacity="0.6"/>
</g>

<!-- Badges inside image — bottom strip, clear of tree -->
<rect x="248" y="430" width="78" height="14" rx="3" fill="#854F0B" opacity="0.9"/>
<text x="287" y="440" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="600" fill="#ffffff">95% accuracy</text>

<rect x="334" y="430" width="74" height="14" rx="3" fill="#185FA5" opacity="0.9"/>
<text x="371" y="440" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="600" fill="#ffffff">14 Hz · Jetson</text>

<rect x="416" y="430" width="46" height="14" rx="3" fill="#085041" opacity="0.9"/>
<text x="439" y="440" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="600" fill="#ffffff">grayscale</text>

<!-- Panel 4 label strip -->
<rect x="240" y="462" width="230" height="14" rx="3" fill="#854F0B" opacity="0.9"/>
<text x="355" y="473" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#ffffff">ADMM reconstruction Î — structure recovered</text>

</svg>
