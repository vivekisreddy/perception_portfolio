<path class="caustic" d="M270,22 L320,18 L360,38 L355,80 L305,85 L265,60 Z" fill="none" stroke="#d0d8e8"/>
<!-- Cell 2 -->
<path class="caustic" d="M320,18 L390,22 L420,55 L400,90 L355,80 L360,38 Z" fill="none" stroke="#c8d4e4"/>
