<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AprilTag Localization — Robot detects tag, sends MQTT code, second robot navigates maze</title>
<desc>Left: Robot 1 approaches and detects an AprilTag fiducial marker. Center: MQTT message transmitted wirelessly. Right: Robot 2 uses the decoded number to navigate through a maze to the destination.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-sm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .robot1 { animation: r1-approach 3s ease-in-out infinite alternate; }
    @keyframes r1-approach { 0% { transform: translateX(0px); } 100% { transform: translateX(18px); } }

    .detect-ring { animation: detect-pulse 1.6s ease-out infinite; transform-origin: 188px 180px; }
    @keyframes detect-pulse { 0% { r: 20; opacity: 0.7; } 100% { r: 40; opacity: 0; } }

    .bbox { animation: bbox-flash 1.6s ease-in-out infinite; }
    @keyframes bbox-flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    .mqtt-wave { opacity: 0; animation: wave-travel 2s ease-in-out infinite; }
    .mqtt-wave:nth-child(1) { animation-delay: 0.0s; }
    .mqtt-wave:nth-child(2) { animation-delay: 0.4s; }
    .mqtt-wave:nth-child(3) { animation-delay: 0.8s; }
    @keyframes wave-travel { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; transform: translateX(16px); } }

    .mqtt-packet { animation: packet-blink 2s ease-in-out infinite; }
    @keyframes packet-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .robot2 { animation: r2-nav 4s ease-in-out infinite alternate; }
    @keyframes r2-nav {
      0%   { transform: translate(0px,   0px); }
      30%  { transform: translate(0px,  -26px); }
      60%  { transform: translate(26px, -26px); }
      100% { transform: translate(26px, -50px); }
    }

    .goal-ring { animation: goal-pulse 1.8s ease-out infinite; transform-origin: 620px 142px; }
    @keyframes goal-pulse { 0% { r: 10; opacity: 0.6; } 100% { r: 22; opacity: 0; } }

    .maze-path { stroke-dasharray: 220; stroke-dashoffset: 220; animation: trace 4s ease-in-out infinite; }
    @keyframes trace { 0% { stroke-dashoffset: 220; opacity: 1; } 80% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0.3; } }

    .lbl { opacity: 0; animation: lbl-in 0.7s ease forwards; }
    .lbl.d1 { animation-delay: 0.2s; }
    .lbl.d2 { animation-delay: 0.5s; }
    .lbl.d3 { animation-delay: 0.8s; }
    .lbl.d4 { animation-delay: 1.1s; }
    .lbl.d5 { animation-delay: 1.4s; }
    @keyframes lbl-in { to { opacity: 1; } }
  </style>
</defs>

<!-- ── PANEL BACKGROUNDS ── -->
<rect x="0"   y="0" width="226" height="400" fill="#185FA5" opacity="0.15"/>
<rect x="227" y="0" width="226" height="400" fill="#854F0B" opacity="0.12"/>
<rect x="454" y="0" width="226" height="400" fill="#085041" opacity="0.15"/>
<line x1="226" y1="24" x2="226" y2="376" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="453" y1="24" x2="453" y2="376" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="4 4"/>

<!-- ── PANEL HEADER LABELS ── -->
<rect class="lbl d1" x="10"  y="12" width="206" height="26" rx="4" fill="#185FA5"/>
<text class="lbl d1" x="113" y="29" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#ffffff">Robot 1 — AprilTag Detection</text>

<rect class="lbl d2" x="237" y="12" width="206" height="26" rx="4" fill="#854F0B"/>
<text class="lbl d2" x="340" y="29" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#ffffff">MQTT Transmission</text>

<rect class="lbl d3" x="463" y="12" width="206" height="26" rx="4" fill="#085041"/>
<text class="lbl d3" x="566" y="29" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#ffffff">Robot 2 — Maze Navigation</text>

<!-- ══════════════════════════
     LEFT — AprilTag Detection
     ══════════════════════════ -->

<rect x="10" y="302" width="206" height="5" rx="2" fill="#888780" opacity="0.5"/>
<polygon points="10,302 110,302 110,228" fill="#D3D1C7" opacity="0.55" stroke="#888780" stroke-width="0.8"/>
<text x="52" y="280" font-family="system-ui,sans-serif" font-size="9" fill="#444441" transform="rotate(-33,52,280)">ramp</text>

<!-- AprilTag -->
<rect x="170" y="155" width="50" height="50" rx="3" fill="#1a1917" stroke="#444441" stroke-width="1"/>
<rect x="176" y="161" width="38" height="38" rx="1" fill="white"/>
<rect x="181" y="166" width="28" height="28" rx="1" fill="#1a1917"/>
<rect x="181" y="166" width="9"  height="9"  fill="white"/>
<rect x="200" y="166" width="9"  height="9"  fill="white"/>
<rect x="181" y="185" width="9"  height="9"  fill="white"/>
<rect x="191" y="176" width="9"  height="9"  fill="white"/>
<rect x="200" y="185" width="9"  height="9"  fill="white"/>

<!-- Tag ID badge -->
<rect x="163" y="211" width="64" height="18" rx="3" fill="#185FA5"/>
<text x="195" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#ffffff">ID: 42</text>

<!-- Detection ring -->
<circle class="detect-ring" cx="188" cy="180" r="20" fill="none" stroke="#378ADD" stroke-width="1.5"/>

<!-- Bounding box corners -->
<g class="bbox">
  <line x1="166" y1="151" x2="166" y2="161" stroke="#378ADD" stroke-width="2" stroke-linecap="round"/>
  <line x1="166" y1="151" x2="176" y2="151" stroke="#378ADD" stroke-width="2" stroke-linecap="round"/>
  <line x1="224" y1="151" x2="224" y2="161" stroke="#378ADD" stroke-width="2" stroke-linecap="round"/>
  <line x1="224" y1="151" x2="214" y2="151" stroke="#378ADD" stroke-width="2" stroke-linecap="round"/>
  <line x1="166" y1="209" x2="166" y2="199" stroke="#378ADD" stroke-width="2" stroke-linecap="round"/>
  <line x1="166" y1="209" x2="176" y2="209" stroke="#378ADD" stroke-width="2" stroke-linecap="round"/>
  <line x1="224" y1="209" x2="224" y2="199" stroke="#378ADD" stroke-width="2" stroke-linecap="round"/>
  <line x1="224" y1="209" x2="214" y2="209" stroke="#378ADD" stroke-width="2" stroke-linecap="round"/>
</g>

<!-- Robot 1 -->
<g class="robot1">
  <rect x="62" y="264" width="44" height="30" rx="5" fill="#185FA5"/>
  <circle cx="72"  cy="296" r="7" fill="#0C447C"/>
  <circle cx="96"  cy="296" r="7" fill="#0C447C"/>
  <circle cx="106" cy="274" r="5" fill="#E6F1FB" stroke="#0C447C" stroke-width="1"/>
  <circle cx="106" cy="274" r="2" fill="#0C447C"/>
  <line x1="111" y1="272" x2="166" y2="200" stroke="#378ADD" stroke-width="0.9" stroke-dasharray="4 3" opacity="0.7" marker-end="url(#arrow-sm)"/>
</g>

<!-- Bottom stat -->
<rect class="lbl d4" x="10" y="328" width="206" height="20" rx="3" fill="#185FA5"/>
<text class="lbl d4" x="113" y="342" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#ffffff">1mm localization accuracy</text>

<!-- ══════════════════════════
     CENTER — MQTT
     ══════════════════════════ -->

<!-- Broker box -->
<rect x="255" y="138" width="170" height="58" rx="6" fill="#854F0B"/>
<text x="340" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#ffffff">MQTT Broker</text>
<text x="340" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#fde68a">client / server</text>

<!-- Packet -->
<g class="mqtt-packet">
  <rect x="275" y="212" width="130" height="26" rx="4" fill="#633806"/>
  <text x="340" y="229" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#ffffff">payload: ID 42</text>
</g>

<!-- Signal arcs left -->
<path class="mqtt-wave" d="M244 156 Q251 168 244 180" fill="none" stroke="#EF9F27" stroke-width="1.8" stroke-linecap="round"/>
<path class="mqtt-wave" d="M236 149 Q247 168 236 187" fill="none" stroke="#EF9F27" stroke-width="1.8" stroke-linecap="round"/>
<path class="mqtt-wave" d="M228 142 Q243 168 228 194" fill="none" stroke="#EF9F27" stroke-width="1.8" stroke-linecap="round"/>

<!-- Signal arcs right -->
<path class="mqtt-wave" d="M432 156 Q439 168 432 180" fill="none" stroke="#1D9E75" stroke-width="1.8" stroke-linecap="round"/>
<path class="mqtt-wave" d="M440 149 Q451 168 440 187" fill="none" stroke="#1D9E75" stroke-width="1.8" stroke-linecap="round"/>
<path class="mqtt-wave" d="M448 142 Q463 168 448 194" fill="none" stroke="#1D9E75" stroke-width="1.8" stroke-linecap="round"/>

<!-- Connector arrows -->
<line x1="226" y1="168" x2="253" y2="168" stroke="#EF9F27" stroke-width="1.2" marker-end="url(#arrow-sm)" opacity="0.8"/>
<line x1="425" y1="168" x2="452" y2="168" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow-sm)" opacity="0.8"/>

<!-- Pub/sub label -->
<rect class="lbl d3" x="255" y="254" width="170" height="20" rx="3" fill="#854F0B"/>
<text class="lbl d3" x="340" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#ffffff">publish / subscribe</text>

<!-- Bottom stat -->
<rect class="lbl d5" x="255" y="328" width="170" height="20" rx="3" fill="#854F0B"/>
<text class="lbl d5" x="340" y="342" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#ffffff">wireless encoded handoff</text>

<!-- ══════════════════════════
     RIGHT — Maze Navigation
     ══════════════════════════ -->

<!-- Maze floor -->
<rect x="463" y="56" width="207" height="272" rx="4" fill="#9FE1CB" opacity="0.2"/>

<!-- Outer walls -->
<rect x="463" y="56"  width="207" height="10" rx="2" fill="#085041" opacity="0.8"/>
<rect x="463" y="318" width="207" height="10" rx="2" fill="#085041" opacity="0.8"/>
<rect x="463" y="56"  width="10"  height="272" rx="2" fill="#085041" opacity="0.8"/>
<rect x="660" y="56"  width="10"  height="272" rx="2" fill="#085041" opacity="0.8"/>

<!-- Inner walls -->
<rect x="473" y="96"  width="60"  height="10" rx="2" fill="#085041" opacity="0.6"/>
<rect x="473" y="144" width="10"  height="70" rx="2" fill="#085041" opacity="0.6"/>
<rect x="533" y="144" width="58"  height="10" rx="2" fill="#085041" opacity="0.6"/>
<rect x="533" y="96"  width="10"  height="50" rx="2" fill="#085041" opacity="0.6"/>
<rect x="591" y="96"  width="10"  height="70" rx="2" fill="#085041" opacity="0.6"/>
<rect x="543" y="214" width="68"  height="10" rx="2" fill="#085041" opacity="0.6"/>
<rect x="543" y="214" width="10"  height="64" rx="2" fill="#085041" opacity="0.6"/>
<rect x="473" y="234" width="44"  height="10" rx="2" fill="#085041" opacity="0.6"/>

<!-- Maze path -->
<path class="maze-path"
      d="M505 300 L505 244 L521 244 L521 154 L591 154 L591 96 L620 96 L620 132"
      fill="none" stroke="#EF9F27" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
      marker-end="url(#arrow)"/>

<!-- Goal -->
<circle class="goal-ring" cx="620" cy="142" r="10" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<circle cx="620" cy="142" r="11" fill="#085041" opacity="0.25" stroke="#085041" stroke-width="1.5" stroke-dasharray="3 2"/>
<circle cx="620" cy="142" r="6"  fill="#0F6E56"/>
<rect x="601" y="116" width="38" height="16" rx="3" fill="#085041"/>
<text x="620" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#ffffff">GOAL</text>

<!-- Robot 2 -->
<g class="robot2" style="transform-origin:505px 300px;">
  <rect x="490" y="278" width="34" height="24" rx="4" fill="#0F6E56"/>
  <circle cx="498" cy="304" r="6" fill="#085041"/>
  <circle cx="516" cy="304" r="6" fill="#085041"/>
  <circle cx="524" cy="286" r="4" fill="#E1F5EE" stroke="#085041" stroke-width="0.8"/>
  <circle cx="524" cy="286" r="2" fill="#085041"/>
</g>

<!-- Decode badge -->
<rect class="lbl d4" x="463" y="328" width="207" height="20" rx="3" fill="#085041"/>
<text class="lbl d4" x="566" y="342" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#ffffff">decoded route: ID 42</text>

<!-- ── TITLE BAR ── -->
<rect x="0" y="370" width="680" height="30" fill="#2a2926" opacity="0.9"/>
<text x="340" y="389" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#ffffff">RBE 2002 · AprilTag Localization &amp; Multi-Robot MQTT Communication · WPI</text>

</svg>
